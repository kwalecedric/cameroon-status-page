<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cameroon Fintech Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div>
        <h1>Cameroon Fintech Status</h1>
        <p class="subtitle">Real-time status of mobile money & banking services in Cameroon</p>
      </div>
      <div id="overall-badge" class="overall-badge"></div>
    </div>

    <!-- LAST CHECKED TIME -->
    <p class="last-checked" id="last-checked"></p>

    <!-- SERVICE CARDS -->
    <div class="services-grid" id="services-grid"></div>

    <!-- INCIDENT LOG -->
    <div class="section-title">Recent incidents</div>
    <div id="incident-log"></div>

    <!-- FOOTER -->
    <div class="footer">
      Built to help Cameroonians know when fintech services are down &mdash;
      <a href="https://kwalecedric.github.io/Transaction-Tracker/" target="_blank">
        See also: Transaction Tracker
      </a>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
